<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#193b5a">
  <meta name="robots" content="noindex,nofollow">
  <title>คนในอยู่ในมือคุณ · Khonnai Hero</title>
  <link rel="icon" href="assets/khonnai-mark.png">
  <link rel="preload" href="assets/noto-sans-thai.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="hero.css">
  <script src="hero.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#content">ข้ามไปเนื้อหา</a>
  <header class="site-header">
    <a class="brand" href="/landing/" aria-label="คนใน หน้าหลัก"><img src="assets/khonnai-mark.png" alt="" width="44" height="44"><span>Khonnai<span class="brand-thai">คนใน</span></span></a>
    <nav aria-label="เมนูหลัก">
      <a class="nav-example" href="/landing/#preview">ดูตัวอย่าง</a>
      <a class="nav-cta" href="/app">เริ่มใช้งานคนใน <span aria-hidden="true">↗</span></a>
    </nav>
  </header>
  <main id="content">
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-copy">
        <p class="eyebrow"><span aria-hidden="true"></span>คนในอยู่ในมือคุณ</p>
        <h1 id="hero-title">ระบบจัดการสต็อก<br><span>สำหรับร้านเสื้อผ้า</span></h1>
        <p class="intro">ดูของแยกไซซ์และสี บันทึกขาย ออกบิล<br class="desktop-break"> แล้วรู้ว่าเหลือเท่าไร</p>
        <div class="actions">
          <a class="button button-primary" href="/app">เริ่มใช้งานคนใน <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></a>
          <a class="button button-secondary" href="/landing/#preview"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m9 6 9 6-9 6Z"/></svg>ดูตัวอย่าง</a>
        </div>
      </div>
      <figure class="hero-figure">
        <div class="media-stage" role="img" aria-label="มือจับโทรศัพท์แสดงหน้าสินค้า Khonnai เลือกไซซ์ M คละสี ขายได้ 12 แพ็ก ข้อมูลตัวอย่าง">
          <img class="poster" src="poster.webp" width="1280" height="1280" alt="" fetchpriority="high">
          <video class="hero-video" poster="poster.webp" width="1280" height="1280" muted playsinline preload="none" aria-hidden="true" tabindex="-1"></video>
        </div>
        <figcaption>
          <span class="sample-note">หน้าจอจริง · ข้อมูลตัวอย่าง</span>
          <button class="playback" type="button" hidden><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 1 7M4 4v6h6"/></svg><span>เล่นอีกครั้ง</span></button>
        </figcaption>
      </figure>
    </section>
  </main>
  <footer class="concept-footer"><span>Khonnai · คนใน</span><span>ดูของ ขายของ และออกบิล</span></footer>
</body>
</html>
