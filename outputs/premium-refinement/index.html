<!doctype html>
<html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Khonnai · Premium refinement comparison</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:28px;background:#fff;color:#193b5a;font:16px/1.6 Tahoma,sans-serif}header{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:24px}h1{font-size:22px;margin:0;font-weight:500}p{margin:4px 0;color:#646464;font-size:14px}.controls{display:flex;gap:12px;margin-left:auto}select{font:inherit;padding:8px 12px;min-height:44px;border:1px solid #797979;border-radius:8px;background:white;color:inherit}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:24px}figure{margin:0;min-width:0}figcaption{padding-bottom:12px;font-size:16px}figure a{display:block;height:calc(100vh - 188px);min-height:360px;overflow:auto;background:#f5f5f5;border:1px solid #ebebeb;border-radius:12px}img{display:block;width:100%;height:auto}.mobile img{max-width:390px;margin:auto}@media(max-width:700px){body{padding:16px}.comparison{grid-template-columns:1fr}.controls{margin-left:0}figure a{height:650px}}:focus-visible{outline:2px solid #193b5a;outline-offset:3px}
</style>
<header><div><h1>Khonnai · Premium refinement</h1><p>ภาพจากแอปจริง · ข้อมูลจำลองสำหรับตรวจ UI · กดภาพเพื่อดูเต็ม</p></div><div class="controls"><label>หน้า <select id="screen"><option value="sale">สร้างบิล</option><option value="catalog">สินค้า</option><option value="detail">รายละเอียดสินค้า</option><option value="settings">ข้อมูลร้าน</option></select></label><label>ขนาด <select id="size"><option value="1440">Desktop</option><option value="390">Mobile</option></select></label></div></header>
<div class="comparison"><figure><figcaption>ก่อนปรับ</figcaption><a id="before-link"><img id="before" alt="หน้าตาก่อนปรับ"></a></figure><figure><figcaption>หลังปรับ</figcaption><a id="after-link"><img id="after" alt="หน้าตาหลังปรับ"></a></figure></div>
<script>
const screen=document.querySelector('#screen'), size=document.querySelector('#size');function update(){document.querySelector('.comparison').classList.toggle('mobile',size.value==='390');for(const stage of ['before','after']){const file=stage+'-'+screen.value+'-'+size.value+'.png';document.getElementById(stage).src=file;document.getElementById(stage+'-link').href=file}}screen.addEventListener('change',update);size.addEventListener('change',update);update();
</script></html>
